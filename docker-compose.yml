services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookmarked}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookmarked_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bookmarked}
    ports:
      - "5433:5432"
    volumes:
      - bookmarked_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookmarked}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4100:4100"
    environment:
      - PORT=4100
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bookmarked}:${POSTGRES_PASSWORD:-bookmarked_dev_password}@db:5432/${POSTGRES_DB:-bookmarked}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}

  web:
    build:
      context: ./web
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4100
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3100:3000"

volumes:
  bookmarked_pgdata:
